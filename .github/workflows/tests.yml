name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit + Windows integration tests
        # WSL tests skip automatically when no suitable distro exists;
        # skipped WSL coverage is not passing WSL coverage.
        run: python -m pytest tests -q
